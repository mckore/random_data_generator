version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pdf-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./app
    container_name: pdf-rag-app
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: pdf_chunks
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-jm-dap-dev-landing-o-use1}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      CHUNK_SIZE: "1000"
      CHUNK_OVERLAP: "150"
    volumes:
      - model_cache:/root/.cache/torch/sentence_transformers
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
  model_cache:
